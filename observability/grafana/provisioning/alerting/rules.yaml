# Правила алертів Grafana (provisioning)
apiVersion: 1

groups:
  - orgId: 1
    name: kcher-alerts
    folder: K_CHER
    interval: 1m
    rules:
      - uid: kcher-rejected-calculations
        title: K_CHER many rejected calculations
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(kcher_calculation_errors_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        annotations:
          summary: Багато відхилених обчислень у K_CHER
          description: За останні 5 хвилин відхилено більше 5 запитів на обчислення (наприклад, ділення на нуль).
        labels:
          severity: warning
          service: kcher

      - uid: kcher-high-latency
        title: K_CHER high p95 latency
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_duration_milliseconds_bucket{job="kcher"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [300]
        annotations:
          summary: Висока затримка відповідей K_CHER
          description: 95-й перцентиль часу відповіді перевищує 300 мс довше 2 хвилин.
        labels:
          severity: warning
          service: kcher
